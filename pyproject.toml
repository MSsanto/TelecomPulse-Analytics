[build-system]
requires = ["setuptools>=75"]
build-backend = "setuptools.build_meta"

[project]
name = "telecompulse-analytics"
version = "0.2.0"
description = "Brazilian telecom market and quality analytics from public official data"
requires-python = ">=3.13"
dependencies = [
    "pandas>=2.2,<3",
    "requests>=2.32,<3"
]

[project.optional-dependencies]
dev = ["pytest>=8,<9", "ruff>=0.8,<1"]

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]

[tool.ruff]
line-length = 100
target-version = "py313"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]
