name: CI

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  python:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'
          cache: pip
      - run: python -m pip install --upgrade pip
      - run: pip install -e '.[dev]'
      - run: ruff check src tests
      - run: pytest -q
      - run: python -m telecom_pulse.cli
      - run: python -m telecom_pulse.presentation_cli
      - run: test -f data/presentation/dashboard-v1.json
      - run: test -f data/presentation/by_carrier.csv
      - run: test -f data/presentation/by_site.csv
      - run: test -f data/presentation/by_cause.csv
      - run: test -f data/presentation/timeline.csv
      - run: test -f data/presentation/incidents.csv

  web:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: web
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: npm install
      - run: npm run build
