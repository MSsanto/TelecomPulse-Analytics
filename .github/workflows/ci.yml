name: CI

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  python:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'
          cache: pip
      - run: python -m pip install --upgrade pip
      - run: pip install -e '.[dev]'
      - run: ruff check src tests
      - run: pytest -q
      - name: Build official public dashboard contract
        run: python -m telecom_pulse.public_cli
      - run: test -f data/presentation/dashboard-v2.json
      - run: grep -q '"data_mode": "official_public"' data/presentation/dashboard-v2.json
      - run: grep -q '"contract_version": "2.0"' data/presentation/dashboard-v2.json
      - name: Reject synthetic NOC metrics from v2 contract
        run: |
          ! grep -q '"incident_count"' data/presentation/dashboard-v2.json
          ! grep -q '"downtime_minutes"' data/presentation/dashboard-v2.json
          ! grep -q '"mttr_minutes"' data/presentation/dashboard-v2.json

  web:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: web
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'
      - run: pip install -e ..
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: npm install
      - run: npm run audit:high
      - run: npm test
      - run: npm run build
      - run: test -f dist/data/dashboard-v2.json
      - name: Enforce JavaScript bundle budget
        run: |
          size=$(find dist/assets -name 'index-*.js' -printf '%s\n' | sort -nr | head -1)
          echo "Largest JS bundle: ${size} bytes"
          test -n "$size"
          test "$size" -le 256000

  cloudflare-build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: bash scripts/build-cloudflare.sh
      - name: Wrangler production deploy dry-run
        run: npx wrangler@4.136.3 deploy --dry-run --outdir .wrangler-dry-run
      - name: Local static smoke test
        run: |
          python -m http.server 4173 --directory web/dist >/tmp/telecompulse-http.log 2>&1 &
          server_pid=$!
          trap 'kill $server_pid' EXIT
          sleep 1
          curl --fail --silent --show-error http://127.0.0.1:4173/ | grep -q "TelecomPulse Analytics"
          curl --fail --silent --show-error http://127.0.0.1:4173/data/dashboard-v2.json | grep -q '"contract_version": "2.0"'
          curl --fail --silent --show-error http://127.0.0.1:4173/data/dashboard-v2.json | grep -q '"data_mode": "official_public"'
